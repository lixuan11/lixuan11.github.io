name: Build & Deploy Hexo (Butterfly)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write   # 允许 actions-gh-pages 推送 gh-pages
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true       # 如果你用 submodule 管理 theme，启用它
          fetch-depth: 0

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          # 缓存 node_modules 或 npm 缓存，加速依赖安装
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm ci

      - name: Ensure theme dependencies (Butterfly)
        working-directory: themes/butterfly
        if: ${{ always() && (exists('themes/butterfly/package.json')) }}
        run: |
          # 若主题有自己的依赖，安装它们
          npm install

      - name: Generate site (Hexo)
        run: |
          # 如果你需要生成draft，可加 -D
          npx hexo generate

      - name: Add CNAME (optional)
        if: ${{ env.CUSTOM_DOMAIN != '' }}
        run: |
          echo "${{ env.CUSTOM_DOMAIN }}" > ./public/CNAME
        env:
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || '' }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./public
          publish_branch: gh-pages
          # 使用内置 GITHUB_TOKEN 部署到同一仓库
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 若你使用 deploy_key 私钥，可以替换为 deploy_key: ${{ secrets.DEPLOY_KEY }}
          # cname: true   # 若 want actions to keep existing CNAME, 可配置
          allow_empty_commit: false
