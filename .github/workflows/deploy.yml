name: Build & Deploy Hexo (Butterfly)
on:
  push:
    branches: [ main ]
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Ensure butterfly theme
        run: |
          if [ ! -d "themes/butterfly" ]; then
            git clone https://github.com/jerryc127/hexo-theme-butterfly.git themes/butterfly
            rm -rf themes/butterfly/.git
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: npm ci
      - name: Install theme deps
        if: ${{ -f 'themes/butterfly/package.json' }}
        run: |
          cd themes/butterfly
          npm ci
          cd -
      - name: Generate
        run: npx hexo generate
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: gh-pages
          publish_dir: ./public
          github_token: ${{ secrets.GITHUB_TOKEN }}