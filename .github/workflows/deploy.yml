name: Deploy Hexo Blog

on:
  push:
    branches:
      - main  # 或者是你的主分支名称，如 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # 或其他你使用的 Node.js 版本
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Ensure Theme Installation
        run: |
          echo "Reinstalling landscape theme to ensure all files are present..."
          rm -rf themes/landscape
          mkdir -p themes/landscape
          npm install hexo-theme-landscape --save
          cp -r node_modules/hexo-theme-landscape/* themes/landscape/
          echo "Verifying theme files after installation:"
          ls -la themes/landscape/
          ls -la themes/landscape/languages/
          ls -la themes/landscape/layout/

      - name: Debug Info
        run: |
          echo "Node.js version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "Hexo version: $(npx hexo -v)"
          echo "Theme directory contents:"
          ls -la themes/
          echo "Landscape theme directory contents:"
          ls -la themes/landscape/
          echo "Package contents:"
          cat package.json
          echo "Config file:"
          cat _config.yml

      - name: Generate Static Files
        run: npm run build  # 确保 package.json 中有 build 脚本指向 hexo generate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages  # 部署到 gh-pages 分支