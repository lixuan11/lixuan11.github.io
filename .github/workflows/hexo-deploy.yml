name: Hexo Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm install
    
    - name: Check Theme Directory
      run: ls -la themes/
    
    - name: Build Hexo Site
      run: npm run build
      env:
        HEXO_NODE_MODULES_HEXO_THEME_BUTTERFLY: themes/butterfly
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
        force_orphan: true