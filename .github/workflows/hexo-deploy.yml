name: Hexo Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: true
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm install
    
    - name: Check Theme Directory
      run: |
        ls -la themes/
        ls -la themes/butterfly/ | head -10
    
    - name: Build Hexo Site
      run: |
        npm run clean
        npm run build
      env:
        HEXO_NODE_MODULES_HEXO_THEME_BUTTERFLY: themes/butterfly
        HEXO_THEME: butterfly
    
    # 确保.nojekyll文件存在于构建输出目录
    - name: Create .nojekyll file in public directory
      run: touch public/.nojekyll
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
        force_orphan: true
        # 显式禁用GitHub Pages的自动构建
        keep_files: false