# Hexo Theme Butterfly 配置文件
# 详细配置文档：https://butterfly.js.org/zh-CN/guide/config.html

# 导航菜单
menu:
  首页: /
  归档: /archives/
  标签: /tags/
  分类: /categories/

# 网站信息
favicon:
  icon_16x16: /img/favicon-16x16-next.png
  icon_32x32: /img/favicon-32x32-next.png
  apple_touch_icon: /img/apple-touch-icon-next.png

# 页脚信息
footer:
  owner:
    enable: true
    since: 2025
  copyright: true
  theme_vn: false
  powered: true

# 文章设置
post:
  reward: 
    enable: false

# 代码块设置
highlight:
  enable: true
  hljs: true